<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pouchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E8F1EB" />
    </linearGradient>
    <linearGradient id="pouchMatte" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE7DE" />
      <stop offset="50%" stop-color="#E0D6C8" />
      <stop offset="100%" stop-color="#D1C3B0" />
    </linearGradient>
    <filter id="pouchShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#16382B" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#pouchBg)" rx="16" />
  <circle cx="200" cy="200" r="135" fill="#16382B" fill-opacity="0.03" />

  <!-- Stand-up Kraft Eco Pouch -->
  <g transform="translate(125, 75)" filter="url(#pouchShadow)">
    <!-- Main Pouch Body -->
    <path d="M15 40 L135 40 L145 220 C145 240, 110 248, 75 248 C40 248, 5 240, 5 220 Z" fill="url(#pouchMatte)" stroke="#C8BCAB" stroke-width="1.2" />
    
    <!-- Pouch Top Seal & Tear Notch -->
    <rect x="15" y="15" width="120" height="25" rx="3" fill="#D8CEBF" stroke="#C0B29E" stroke-width="1" />
    <line x1="20" y1="28" x2="130" y2="28" stroke="#A89B86" stroke-dasharray="2 3" stroke-width="1" />
    <!-- Tear notches -->
    <path d="M15 32 L20 35 L15 38 Z" fill="#998C76" />
    <path d="M135 32 L130 35 L135 38 Z" fill="#998C76" />

    <!-- Pure Botanical Label -->
    <rect x="25" y="60" width="100" height="155" rx="6" fill="#FFFFFF" stroke="#E5DDD0" stroke-width="1" />
    
    <!-- Top Gold Bar -->
    <rect x="25" y="60" width="100" height="6" fill="#C29043" rx="6 6 0 0" />

    <!-- Label Content -->
    <text x="75" y="85" font-family="'Fraunces', serif" font-size="11" font-weight="700" fill="#16382B" text-anchor="middle" letter-spacing="1.5">RUTHRA</text>
    <text x="75" y="96" font-family="'Inter', sans-serif" font-size="6" font-weight="500" fill="#C29043" text-anchor="middle" letter-spacing="2">KUDINEER</text>
    
    <!-- Decoction Pot / Herb Icon -->
    <circle cx="75" cy="115" r="13" fill="#E8F1EB" stroke="#16382B" stroke-width="0.8" />
    <path d="M68 116 C68 123, 82 123, 82 116 C82 111, 75 107, 75 107 C75 107, 68 111, 68 116 Z" fill="#16382B" />
    <circle cx="75" cy="114" r="2" fill="#C29043" />

    <text x="75" y="142" font-family="'Fraunces', serif" font-size="9" font-weight="600" fill="#264653" text-anchor="middle">DECOCTION BLEND</text>
    <text x="75" y="153" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="8.5" fill="#16382B" text-anchor="middle">குடிநீர் சூரணம்</text>
    
    <rect x="35" y="162" width="80" height="0.8" fill="#C29043" fill-opacity="0.4" />

    <!-- Weight Tag -->
    <rect x="42" y="172" width="66" height="16" rx="3" fill="#FAF8F5" stroke="#D1C3B0" stroke-width="0.8" />
    <text x="75" y="183" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#16382B" text-anchor="middle">NET WT. 100g</text>
    <text x="75" y="202" font-family="'Inter', sans-serif" font-size="5.5" fill="#889886" text-anchor="middle">TIRUNELVELI SIDDHA HOUSE</text>
  </g>
</svg>
