<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dropsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E8F1EB" />
    </linearGradient>
    <linearGradient id="blueGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3A36" />
      <stop offset="40%" stop-color="#2D5852" />
      <stop offset="80%" stop-color="#234641" />
      <stop offset="100%" stop-color="#162D2A" />
    </linearGradient>
    <filter id="dropsShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#16382B" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#dropsBg)" rx="0" />
  <circle cx="200" cy="200" r="135" fill="#16382B" fill-opacity="0.03" />
  <ellipse cx="200" cy="336" rx="60" ry="12" fill="#16382B" fill-opacity="0.08" />

  <g transform="translate(150, 70)" filter="url(#dropsShadow)">
    <!-- Dropper Bulb (Rubber Top) -->
    <path d="M38 8 C38 0, 62 0, 62 8 L64 26 L36 26 Z" fill="#2E2E2E" />
    <!-- Gold Pipette Collar -->
    <rect x="32" y="26" width="36" height="18" rx="2" fill="#C29043" stroke="#9E7331" stroke-width="0.8" />
    <line x1="32" y1="35" x2="68" y2="35" stroke="#E1B873" stroke-width="1" />

    <!-- Bottle Neck -->
    <rect x="39" y="44" width="22" height="14" fill="url(#blueGlass)" />

    <!-- Compact Bottle Body (50ml) -->
    <path d="M39 58 C28 65, 16 78, 16 98 L16 200 C16 214, 26 222, 50 222 C74 222, 84 214, 84 200 L84 98 C84 78, 72 65, 61 58 Z" fill="url(#blueGlass)" />

    <!-- Label -->
    <g transform="translate(22, 92)">
      <rect width="56" height="110" rx="4" fill="#FFFFFF" stroke="#D1DDD5" stroke-width="0.8" />
      <rect x="0" y="0" width="56" height="4" fill="#C29043" rx="4 4 0 0" />

      <text x="28" y="18" font-family="'Fraunces', serif" font-size="8" font-weight="700" fill="#16382B" text-anchor="middle" letter-spacing="1">RUTHRA</text>
      <text x="28" y="26" font-family="'Inter', sans-serif" font-size="4.5" font-weight="600" fill="#C29043" text-anchor="middle" letter-spacing="1">DROPS</text>

      <circle cx="28" cy="40" r="8" fill="#E8F1EB" />
      <path d="M28 35 C25 38, 24 41, 28 45 C32 41, 31 38, 28 35 Z" fill="#16382B" />

      <text x="28" y="60" font-family="'Fraunces', serif" font-size="6.5" font-weight="600" fill="#264653" text-anchor="middle">ESY SWAS</text>
      <text x="28" y="70" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="6" fill="#16382B" text-anchor="middle">சொட்டு மருந்து</text>

      <rect x="8" y="76" width="40" height="0.6" fill="#C29043" fill-opacity="0.4" />

      <rect x="10" y="82" width="36" height="12" rx="2" fill="#E8F1EB" />
      <text x="28" y="90" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#16382B" text-anchor="middle">50ml INHALER</text>
    </g>
  </g>
</svg>
