<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="syrupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E8F1EB" />
    </linearGradient>
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F3C2C" />
      <stop offset="35%" stop-color="#2D5A42" />
      <stop offset="70%" stop-color="#234B36" />
      <stop offset="100%" stop-color="#142C20" />
    </linearGradient>
    <filter id="syrupShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#16382B" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#syrupBg)" rx="0" />
  <circle cx="200" cy="200" r="135" fill="#16382B" fill-opacity="0.03" />

  <ellipse cx="200" cy="336" rx="68" ry="14" fill="#16382B" fill-opacity="0.08" />

  <g transform="translate(142, 55)" filter="url(#syrupShadow)">
    <!-- Transparent Plastic Measuring Cup on top -->
    <rect x="36" y="8" width="44" height="24" rx="3" fill="#FFFFFF" fill-opacity="0.6" stroke="#D1DDD5" stroke-width="1" />
    <line x1="42" y1="16" x2="52" y2="16" stroke="#16382B" stroke-width="1" stroke-opacity="0.4" />
    <line x1="42" y1="22" x2="48" y2="22" stroke="#16382B" stroke-width="1" stroke-opacity="0.4" />

    <!-- Green ribbed cap -->
    <rect x="40" y="32" width="36" height="22" rx="2" fill="#16382B" stroke="#0E231B" stroke-width="0.8" />
    
    <!-- Bottle neck -->
    <rect x="45" y="54" width="26" height="18" fill="url(#bottleBody)" />

    <!-- Bottle Body -->
    <path d="M45 72 C32 80, 14 96, 14 122 L14 246 C14 260, 26 268, 58 268 C90 268, 102 260, 102 246 L102 122 C102 96, 84 80, 71 72 Z" fill="url(#bottleBody)" />

    <!-- Front Label -->
    <g transform="translate(22, 114)">
      <rect width="72" height="130" rx="4" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="0.8" />
      <rect x="0" y="0" width="72" height="5" fill="#C29043" rx="4 4 0 0" />

      <text x="36" y="22" font-family="'Fraunces', serif" font-size="9" font-weight="700" fill="#16382B" text-anchor="middle" letter-spacing="1">RUTHRA</text>
      <text x="36" y="31" font-family="'Inter', sans-serif" font-size="5" font-weight="600" fill="#C29043" text-anchor="middle" letter-spacing="1.5">HERBAL SYRUP</text>

      <circle cx="36" cy="46" r="9" fill="#E8F1EB" />
      <!-- Leaf icon -->
      <path d="M36 41 C33 44, 33 49, 36 52 C39 49, 39 44, 36 41 Z" fill="#16382B" />

      <text x="36" y="68" font-family="'Fraunces', serif" font-size="7" font-weight="600" fill="#264653" text-anchor="middle">SIDDHA ELIXIR</text>
      <text x="36" y="78" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="7" fill="#16382B" text-anchor="middle">மூலிகை சிரப்</text>

      <rect x="12" y="86" width="48" height="0.8" fill="#C29043" fill-opacity="0.4" />

      <rect x="14" y="93" width="44" height="14" rx="2" fill="#E8F1EB" />
      <text x="36" y="103" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#16382B" text-anchor="middle">NET 100ml</text>
      <text x="36" y="118" font-family="'Inter', sans-serif" font-size="4.5" fill="#889886" text-anchor="middle">HONEY SWEETENED</text>
    </g>
  </g>
</svg>
