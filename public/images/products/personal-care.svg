<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F5ECE1" />
    </linearGradient>
    <linearGradient id="kraftPouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C7B2" />
      <stop offset="30%" stop-color="#E8DCCE" />
      <stop offset="70%" stop-color="#DECBB6" />
      <stop offset="100%" stop-color="#C7B299" />
    </linearGradient>
    <filter id="pcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5C4033" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#pcBg)" rx="0" />
  <circle cx="200" cy="200" r="140" fill="#16382B" fill-opacity="0.03" />
  <circle cx="200" cy="200" r="110" fill="none" stroke="#C29043" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.3" />

  <!-- Botanical Turmeric / Hibiscus Petals -->
  <g opacity="0.7">
    <path d="M70 290 C60 270, 75 250, 95 260 C110 275, 90 305, 70 290 Z" fill="#E67E22" opacity="0.4" />
    <path d="M310 280 C330 260, 340 280, 325 300 C305 310, 295 290, 310 280 Z" fill="#C0392B" opacity="0.35" />
    <circle cx="100" cy="120" r="6" fill="#F39C12" opacity="0.5" />
    <circle cx="300" cy="110" r="8" fill="#27AE60" opacity="0.3" />
  </g>

  <!-- Pouch Group -->
  <g transform="translate(130, 80)" filter="url(#pcShadow)">
    <!-- Standup Pouch shape -->
    <path d="M15 15 L125 15 L135 195 C135 210, 115 220, 70 220 C25 220, 5 210, 5 195 Z" fill="url(#kraftPouch)" stroke="#B8A38B" stroke-width="1.5" />
    
    <!-- Zip Crimp -->
    <rect x="15" y="15" width="110" height="16" fill="#CBB69D" rx="2" />
    <line x1="15" y1="23" x2="125" y2="23" stroke="#8C7355" stroke-width="1" stroke-dasharray="3 2" />
    <circle cx="25" cy="23" r="3" fill="#FAF8F5" />
    <circle cx="115" cy="23" r="3" fill="#FAF8F5" />

    <!-- Front Label -->
    <rect x="22" y="45" width="96" height="145" rx="8" fill="#FFFDF9" stroke="#C29043" stroke-width="1" />
    
    <!-- Header -->
    <text x="70" y="65" font-family="'Fraunces', serif" font-size="10" font-weight="700" fill="#16382B" text-anchor="middle" letter-spacing="1.5">RUTHRA’S</text>
    <text x="70" y="76" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#C29043" text-anchor="middle" letter-spacing="1.2">HERBAL PERSONAL CARE</text>
    
    <!-- Decorative Center Icon -->
    <circle cx="70" cy="95" r="13" fill="#FAF3EB" stroke="#C29043" stroke-width="0.8" />
    <!-- Flower Petals -->
    <path d="M70 87 C68 91, 68 95, 70 99 C72 95, 72 91, 70 87 Z" fill="#E67E22" />
    <path d="M62 95 C66 93, 70 93, 74 95 C70 97, 66 97, 62 95 Z" fill="#E67E22" />
    <circle cx="70" cy="95" r="3" fill="#C29043" />

    <!-- Titles -->
    <text x="70" y="122" font-family="'Fraunces', serif" font-size="8.5" font-weight="700" fill="#16382B" text-anchor="middle">NALANGU / SHIGAKAI</text>
    <text x="70" y="132" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="7" fill="#8C531B" text-anchor="middle">பாரம்பரிய மூலிகைப் பொடி</text>
    <line x1="35" y1="138" x2="105" y2="138" stroke="#DFB36C" stroke-width="0.8" opacity="0.6" />

    <!-- Badges -->
    <rect x="36" y="145" width="68" height="15" rx="4" fill="#E8F1EB" />
    <text x="70" y="156" font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#16382B" text-anchor="middle">75 GMS • 100% HERBAL</text>
    <text x="70" y="174" font-family="'Inter', sans-serif" font-size="5.5" fill="#8A9A86" text-anchor="middle">SOAP-FREE • NATURAL GLOW</text>
  </g>
</svg>