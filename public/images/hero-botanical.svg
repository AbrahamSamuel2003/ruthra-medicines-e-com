<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E8F1EB" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FAF8F5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F2EFEA" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="stonePestle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D45" />
      <stop offset="50%" stop-color="#22352E" />
      <stop offset="100%" stop-color="#14211C" />
    </linearGradient>
    <linearGradient id="brassPot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5620" />
      <stop offset="35%" stop-color="#D4A759" />
      <stop offset="70%" stop-color="#C29043" />
      <stop offset="100%" stop-color="#5B3E14" />
    </linearGradient>
    <filter id="softDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#16382B" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#heroGlow)" rx="24" />

  <!-- Subtle sacred geometry / botanical mandala lines (very delicate, not loud) -->
  <circle cx="400" cy="300" r="240" fill="none" stroke="#C29043" stroke-width="0.8" stroke-dasharray="6 8" stroke-opacity="0.25" />
  <circle cx="400" cy="300" r="180" fill="none" stroke="#16382B" stroke-width="0.8" stroke-opacity="0.15" />

  <!-- Background decorative botanical foliage silhouettes -->
  <g opacity="0.18" fill="#16382B">
    <!-- Palm & herbal leaf silhouettes -->
    <path d="M120 480 C110 360, 160 260, 260 200 C220 280, 200 370, 180 480 Z" />
    <path d="M680 490 C690 370, 640 270, 540 210 C580 290, 600 380, 620 490 Z" />
    <path d="M220 520 C230 420, 300 350, 360 320 C320 380, 300 450, 290 520 Z" />
  </g>

  <!-- Ground plane shadow -->
  <ellipse cx="400" cy="460" rx="280" ry="35" fill="#16382B" fill-opacity="0.08" />

  <!-- Traditional Granite Siddha Kalvam (Mortar and Pestle / Stone Grinder) -->
  <g transform="translate(260, 270)" filter="url(#softDepth)">
    <!-- Base stone bowl (Kalvam) -->
    <path d="M20 120 C20 70, 60 40, 140 40 C220 40, 260 70, 260 120 C260 165, 210 180, 140 180 C70 180, 20 165, 20 120 Z" fill="url(#stonePestle)" stroke="#4E6159" stroke-width="1.5" />
    
    <!-- Inner stone bowl depression with crushed green herbs -->
    <ellipse cx="140" cy="115" rx="95" ry="42" fill="#1A2923" />
    <!-- Crushed botanical paste (Pirandai / Mudakkathan pulp) -->
    <ellipse cx="140" cy="118" rx="70" ry="28" fill="#2E543E" />
    <ellipse cx="145" cy="116" rx="45" ry="18" fill="#3D6B50" />

    <!-- Stone Pestle angled across the kalvam -->
    <path d="M70 60 C80 50, 95 55, 190 135 C200 145, 195 155, 185 160 C175 165, 165 155, 75 75 C68 70, 65 65, 70 60 Z" fill="url(#stonePestle)" stroke="#455850" stroke-width="1" />
  </g>

  <!-- Traditional Brass Vessel (Kimbara / Decoction Urli) -->
  <g transform="translate(130, 300)" filter="url(#softDepth)">
    <!-- Brass bowl -->
    <ellipse cx="60" cy="140" rx="55" ry="18" fill="#16382B" fill-opacity="0.1" />
    <path d="M10 70 C10 110, 30 130, 60 130 C90 130, 110 110, 110 70 L100 50 L20 50 Z" fill="url(#brassPot)" stroke="#8F682C" stroke-width="1" />
    <!-- Flanged rim -->
    <ellipse cx="60" cy="50" rx="46" ry="12" fill="#DFB36C" stroke="#7A5620" stroke-width="0.8" />
    <ellipse cx="60" cy="50" rx="38" ry="9" fill="#996E2E" />
  </g>

  <!-- Small Amber Siddha Medicine Flask on right side -->
  <g transform="translate(560, 290)" filter="url(#softDepth)">
    <ellipse cx="40" cy="155" rx="35" ry="12" fill="#16382B" fill-opacity="0.1" />
    <!-- Bottle body -->
    <path d="M15 80 C15 65, 25 55, 32 50 L32 30 L48 30 L48 50 C55 55, 65 65, 65 80 L65 145 C65 152, 58 156, 40 156 C22 156, 15 152, 15 145 Z" fill="#6A3D16" stroke="#4A290E" stroke-width="1" />
    <!-- Cork / brass cap -->
    <rect x="33" y="16" width="14" height="14" rx="2" fill="#C29043" stroke="#8A6328" stroke-width="0.8" />
    <!-- Mini label with Tamil text -->
    <rect x="22" y="78" width="36" height="50" rx="2" fill="#FAF8F5" stroke="#D1C3B0" stroke-width="0.5" />
    <text x="40" y="92" font-family="'Fraunces', serif" font-size="5" font-weight="700" fill="#16382B" text-anchor="middle">RUTHRA</text>
    <text x="40" y="103" font-family="'Noto Sans Tamil', sans-serif" font-size="5" fill="#C29043" text-anchor="middle">தைலம்</text>
  </g>

  <!-- Scattered herbal twigs, dried pepper corn, cardamom, star anise -->
  <g fill="#3D5A47">
    <!-- Fresh green leaves -->
    <path d="M210 420 C230 405, 240 420, 245 440 C230 440, 215 435, 210 420 Z" />
    <path d="M242 425 C260 415, 270 425, 272 445 C255 445, 245 440, 242 425 Z" />
    <circle cx="510" cy="445" r="4.5" fill="#16382B" />
    <circle cx="522" cy="452" r="3.8" fill="#16382B" />
    <circle cx="515" cy="458" r="4.2" fill="#2E4037" />
    <!-- Cardamom pods -->
    <ellipse cx="490" cy="440" rx="5" ry="9" transform="rotate(30, 490, 440)" fill="#68846E" stroke="#4B6651" stroke-width="0.5" />
    <ellipse cx="478" cy="450" rx="4.5" ry="8" transform="rotate(-40, 478, 450)" fill="#73917A" stroke="#4B6651" stroke-width="0.5" />
  </g>

  <!-- Refined Editorial Title Stamp inside the image -->
  <g transform="translate(400, 105)">
    <text x="0" y="0" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#16382B" text-anchor="middle" letter-spacing="3">RUTHRA MEDICINES</text>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#C29043" text-anchor="middle" letter-spacing="4">TIRUNELVELI • TAMIL NADU</text>
    <line x1="-80" y1="34" x2="80" y2="34" stroke="#C29043" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="48" font-family="'Noto Sans Tamil', sans-serif" font-size="10" fill="#264653" text-anchor="middle">பாரம்பரிய சித்த மருத்துவ இல்லம்</text>
  </g>
</svg>
