<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3F8" />
      <stop offset="100%" stop-color="#F7DCE9" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D85A87" />
      <stop offset="100%" stop-color="#9C2758" />
    </linearGradient>
    <filter id="shadowWm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9C2758" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#wmBg)" rx="24" />
  
  <circle cx="200" cy="180" r="120" fill="#FFF" fill-opacity="0.6" stroke="#D85A87" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="url(#pinkGrad)" filter="url(#shadowWm)" />

  <!-- Lotus & Uterine Tone Harmony -->
  <g transform="translate(200, 180)" fill="none" stroke="#FAF8F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Lotus Petal -->
    <path d="M0 -45 C-15 -25, -15 15, 0 35 C15 15, 15 -25, 0 -45 Z" fill="#FFF" fill-opacity="0.4" stroke="#FFF" stroke-width="3" />
    <!-- Left Petal -->
    <path d="M-5 5 C-35 -15, -45 5, -25 25 C-15 32, -5 35, -5 35 Z" fill="#FCE4EC" fill-opacity="0.3" stroke="#FFF" stroke-width="2.5" />
    <!-- Right Petal -->
    <path d="M5 5 C35 -15, 45 5, 25 25 C15 32, 5 35, 5 35 Z" fill="#FCE4EC" fill-opacity="0.3" stroke="#FFF" stroke-width="2.5" />
    <!-- Base Crescent -->
    <path d="M-40 30 Q0 55 40 30" stroke="#DFB36C" stroke-width="3" />
    <circle cx="0" cy="-5" r="6" fill="#DFB36C" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(50, 310)">
    <rect width="300" height="60" rx="16" fill="#751A40" />
    <text x="150" y="27" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#DFB36C" text-anchor="middle">WOMEN’S WELLNESS &amp; PCOS</text>
    <text x="150" y="46" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="11" fill="#FAF8F5" text-anchor="middle">மாதவிடாய் &amp; கர்ப்பப்பை நலம்</text>
  </g>
</svg>