<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F4" />
      <stop offset="100%" stop-color="#D5E8DD" />
    </linearGradient>
    <linearGradient id="greenDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#264653" />
      <stop offset="100%" stop-color="#14242B" />
    </linearGradient>
    <filter id="shadowMet" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14242B" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#metBg)" rx="24" />
  
  <circle cx="200" cy="180" r="120" fill="#FFF" fill-opacity="0.6" stroke="#264653" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="url(#greenDark)" filter="url(#shadowMet)" />

  <!-- Shield & Metabolic Glycemic Balance Leaf -->
  <g transform="translate(200, 180)" fill="none" stroke="#FAF8F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield Outline -->
    <path d="M0 -50 L40 -30 C40 10, 25 45, 0 55 C-25 45, -40 10, -40 -30 Z" fill="#FFF" fill-opacity="0.25" stroke="#FFF" stroke-width="3" />
    <!-- Botanical Herbal Leaf -->
    <path d="M0 -35 C-20 -15, -15 15, 0 35 C15 15, 20 -15, 0 -35 Z" fill="#DFB36C" stroke="#FFF" stroke-width="2" />
    <!-- Pulse check line -->
    <path d="M-25 0 L-10 0 L-3 -15 L5 15 L12 0 L25 0" stroke="#FFF" stroke-width="2.5" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(50, 310)">
    <rect width="300" height="60" rx="16" fill="#14242B" />
    <text x="150" y="27" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#DFB36C" text-anchor="middle">METABOLIC &amp; DIABETES CARE</text>
    <text x="150" y="46" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="11" fill="#FAF8F5" text-anchor="middle">சர்க்கரை &amp; சிறுநீரக கல் பாதுகாப்பு</text>
  </g>
</svg>