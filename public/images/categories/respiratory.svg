<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="respBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9F8" />
      <stop offset="100%" stop-color="#D7EFEA" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#1B625A" />
    </linearGradient>
    <filter id="shadowResp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B625A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#respBg)" rx="24" />
  
  <circle cx="200" cy="180" r="120" fill="#FFF" fill-opacity="0.6" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="url(#tealGrad)" filter="url(#shadowResp)" />

  <!-- Lungs & Airways Vector -->
  <g transform="translate(200, 180)" fill="none" stroke="#FAF8F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trachea -->
    <path d="M0 -55 L0 -15 M-10 -45 L10 -45 M-10 -35 L10 -35 M-10 -25 L10 -25" stroke-width="3.5" />
    <!-- Bronchi -->
    <path d="M0 -15 Q-15 0 -30 10 M0 -15 Q15 0 30 10" stroke-width="3.5" />
    <!-- Left Lung -->
    <path d="M-15 -10 C-45 -10, -65 15, -60 45 C-55 70, -25 65, -15 40 Z" fill="#FFF" fill-opacity="0.3" stroke="#FFF" stroke-width="3" />
    <!-- Right Lung -->
    <path d="M15 -10 C45 -10, 65 15, 60 45 C55 70, 25 65, 15 40 Z" fill="#FFF" fill-opacity="0.3" stroke="#FFF" stroke-width="3" />
    <!-- Clean Breath Vapor Swirl -->
    <path d="M-20 -55 Q0 -70 20 -55 Q0 -40 -20 -55" stroke="#DFB36C" stroke-width="2.5" fill="none" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(50, 310)">
    <rect width="300" height="60" rx="16" fill="#1B625A" />
    <text x="150" y="27" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#DFB36C" text-anchor="middle">RESPIRATORY &amp; IMMUNITY</text>
    <text x="150" y="46" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="11" fill="#FAF8F5" text-anchor="middle">சுவாச நலம் &amp; சளி இருமல் பாதுகாப்பு</text>
  </g>
</svg>