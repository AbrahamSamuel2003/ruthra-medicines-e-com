<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FC" />
      <stop offset="100%" stop-color="#D9E8F5" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#457B9D" />
      <stop offset="100%" stop-color="#1D3557" />
    </linearGradient>
    <filter id="shadowSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1D3557" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#shBg)" rx="24" />
  
  <circle cx="200" cy="180" r="120" fill="#FFF" fill-opacity="0.6" stroke="#457B9D" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="url(#blueGrad)" filter="url(#shadowSh)" />

  <!-- Botanical Oil Drop & Radiant Glow -->
  <g transform="translate(200, 180)" fill="none" stroke="#FAF8F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Golden Droplet -->
    <path d="M0 -50 C-30 -10, -35 25, 0 45 C35 25, 30 -10, 0 -50 Z" fill="#DFB36C" fill-opacity="0.8" stroke="#FFF" stroke-width="3" />
    <!-- Leaf Inside Droplet -->
    <path d="M0 -30 C-15 -10, -10 15, 0 30 C10 15, 15 -10, 0 -30 Z" fill="#1D3557" stroke="#FFF" stroke-width="1.5" />
    <!-- Radiance Sparkles -->
    <path d="M-45 -25 L-35 -25 M45 -25 L35 -25 M-40 20 L-30 15 M40 20 L30 15" stroke="#DFB36C" stroke-width="2.5" />
    <circle cx="0" cy="0" r="3" fill="#FFF" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(50, 310)">
    <rect width="300" height="60" rx="16" fill="#1D3557" />
    <text x="150" y="27" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#DFB36C" text-anchor="middle">SKIN, HAIR &amp; WOUND CARE</text>
    <text x="150" y="46" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="11" fill="#FAF8F5" text-anchor="middle">சரும பொலிவு &amp; கூந்தல் வளர்ச்சி</text>
  </g>
</svg>