<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="digBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF6F5" />
      <stop offset="100%" stop-color="#FCE4E1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51" />
      <stop offset="100%" stop-color="#B83B1E" />
    </linearGradient>
    <filter id="shadowDig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#B83B1E" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#digBg)" rx="24" />
  
  <circle cx="200" cy="180" r="120" fill="#FFF" fill-opacity="0.6" stroke="#E76F51" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="95" fill="url(#redGrad)" filter="url(#shadowDig)" />

  <!-- Digestive Agni Fire & Stomach Harmony -->
  <g transform="translate(200, 180)" fill="none" stroke="#FAF8F5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stomach outline -->
    <path d="M-15 -45 C5 -50, 30 -30, 25 5 C20 40, -10 50, -35 40 C-55 30, -50 -5, -30 -20 L-15 -45 Z" fill="#FFF" fill-opacity="0.25" stroke="#FFF" stroke-width="3.5" />
    <!-- Agni / Fire inside -->
    <path d="M-5 15 C-15 5, -5 -15, -2 -25 C5 -15, 18 -5, 12 15 C8 25, -2 25, -5 15 Z" fill="#F4A261" stroke="#DFB36C" stroke-width="2" />
    <path d="M-2 15 C-6 10, -2 0, 0 -5 C3 0, 8 10, 4 15 Z" fill="#E76F51" />
  </g>

  <!-- Title Pill -->
  <g transform="translate(50, 310)">
    <rect width="300" height="60" rx="16" fill="#8C2B14" />
    <text x="150" y="27" font-family="'Fraunces', serif" font-size="14" font-weight="700" fill="#DFB36C" text-anchor="middle">DIGESTION, GERD &amp; LIVER</text>
    <text x="150" y="46" font-family="'Noto Sans Tamil', 'Inter', sans-serif" font-size="11" fill="#FAF8F5" text-anchor="middle">செரிமானம் &amp; பித்த சமநிலை</text>
  </g>
</svg>